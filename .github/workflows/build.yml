name: Build firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini', 'amy/platformio.ini') }}

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      - name: Build (CardputerSynth)
        run: pio run -e cardputer-adv

      - name: Build (CardputerAMY)
        run: pio run -d amy -e cardputer-adv-amy

      - name: Inspect DSP hot path (diagnostics)
        run: |
          OBJDUMP=$(find ~/.platformio/packages -name "xtensa-esp32s3-elf-objdump" -o -name "xtensa-esp-elf-objdump" | head -n1)
          ELF=.pio/build/cardputer-adv/firmware.elf
          for fn in "JunoEngine::renderVoice" "Dx7Engine::renderVoice"; do
            echo "=== $fn"
            $OBJDUMP -d -C $ELF | awk -v f="$fn" '$0 ~ "<syn::"f && /:$/ {p=1} p && /^$/ {exit} p' > fn.txt
            head -n1 fn.txt
            echo "instructions: $(grep -c '^ *[0-9a-f]*:' fn.txt)"
            echo "calls:"; grep -E 'call' fn.txt | grep -oE '<[^>]+>' | sort | uniq -c
          done

      - name: Package binaries
        run: |
          B=.pio/build/cardputer-adv
          BOOT_APP0=$(find ~/.platformio/packages -name boot_app0.bin | head -n1)
          mkdir -p dist
          # App-only image: for SD-card launchers (M5Launcher, Bruce, etc.)
          cp $B/firmware.bin dist/CardputerSynth-app.bin
          # Full image: flash at offset 0x0 (web flasher, esptool, M5Burner)
          esptool.py --chip esp32s3 merge_bin -o dist/CardputerSynth-full.bin \
            --flash_mode dio --flash_freq 80m --flash_size 8MB \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOT_APP0" 0x10000 $B/firmware.bin
          A=amy/.pio/build/cardputer-adv-amy
          cp $A/firmware.bin dist/CardputerAMY-app.bin
          esptool.py --chip esp32s3 merge_bin -o dist/CardputerAMY-full.bin \
            --flash_mode dio --flash_freq 80m --flash_size 8MB \
            0x0 $A/bootloader.bin 0x8000 $A/partitions.bin 0xe000 "$BOOT_APP0" 0x10000 $A/firmware.bin
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: CardputerSynth-firmware
          path: dist/*.bin

      - name: Publish "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: false
          make_latest: true
          body: |
            Built automatically from ${{ github.sha }}.
            **CardputerSynth** (custom Juno + DX7 engines) and **CardputerAMY** (AMY engine: 128 Juno-6, 128 DX7, piano)
            - **…-app.bin**: copy to the SD card and launch with M5Launcher / Bruce.
            - **…-full.bin**: flash at address 0x0 with a web flasher, esptool or M5Burner.
          files: dist/*.bin
