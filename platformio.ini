; PlatformIO build for the Cardputer-Adv.
; The sketch lives in ./CardputerSynth so the same folder also opens in the Arduino IDE.
[platformio]
src_dir = CardputerSynth

[env:cardputer-adv]
; pioarduino = Arduino-ESP32 core 3.x (what M5Stack's own board package uses)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_unflags = -Os
build_flags =
    -O2
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    m5stack/M5Unified@>=0.2.8
    m5stack/M5GFX@>=0.2.10
    M5Cardputer=https://github.com/m5stack/M5Cardputer
