; PlatformIO build for the AMY-based version (Cardputer-Adv).
; Build from the repo root with:  pio run -d amy
[platformio]
src_dir = CardputerAMY

[env:cardputer-adv-amy]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_unflags = -Os
build_flags =
    -O2
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    ; compile AMY's 5 built-in wavetables in (Wavetable bank)
    -DAMY_WAVETABLE
    ; AMY's C sources trip GCC 14's stricter defaults (errors, not real bugs)
    -Wno-error=incompatible-pointer-types
    -Wno-error=int-conversion
    -Wno-error=implicit-function-declaration
lib_deps =
    ; AMY is pinned: amy_patch_names.h was generated from this exact version
    https://github.com/shorepine/amy.git#9cdf615da9ed8c7de85b9c71ea96f8307be5fd70
    m5stack/M5Unified@>=0.2.8
    m5stack/M5GFX@>=0.2.10
    M5Cardputer=https://github.com/m5stack/M5Cardputer
